name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI
        - Analysis / DIC engine
        - Reports / exports
        - Cloud sync
        - Docs / website
        - Other
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Additional context
      description: Mockups, examples, or links
