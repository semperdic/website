<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="240" rx="10" fill="#ffffff" stroke="#d8dee4"/>

  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa4ae"/>
    </marker>
  </defs>

  <rect x="20" y="74" width="150" height="66" rx="8" fill="#e8f4fb" stroke="#0288d1"/>
  <text x="95" y="103" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">1 · Load frames</text>
  <text x="95" y="124" text-anchor="middle" font-size="14" fill="#5b6b7a">and set their order</text>

  <path d="M174 107 h26" stroke="#9aa4ae" stroke-width="1.6" marker-end="url(#w)"/>

  <rect x="204" y="74" width="150" height="66" rx="8" fill="#e8f4fb" stroke="#0288d1"/>
  <text x="279" y="103" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">2 · Settings</text>
  <text x="279" y="124" text-anchor="middle" font-size="14" fill="#5b6b7a">ROI + mode</text>

  <!-- single path -->
  <path d="M358 94 h92" stroke="#9aa4ae" stroke-width="1.6" marker-end="url(#w)"/>
  <text x="404" y="86" text-anchor="middle" font-size="14" fill="#0277bd">single</text>

  <!-- sweep path -->
  <path d="M358 122 h34 v46 h56" stroke="#9aa4ae" stroke-width="1.6" fill="none" marker-end="url(#w)"/>
  <text x="404" y="150" text-anchor="middle" font-size="14" fill="#c98a1a">sweep</text>

  <rect x="452" y="150" width="150" height="52" rx="8" fill="#fff8e6" stroke="#e0b040" stroke-dasharray="4 3"/>
  <text x="527" y="173" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">3 · Sweep setup</text>
  <text x="527" y="192" text-anchor="middle" font-size="13" fill="#5b6b7a">ranges + samples</text>

  <rect x="454" y="74" width="146" height="48" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="527" y="104" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Compute</text>

  <path d="M604 98 h24" stroke="#9aa4ae" stroke-width="1.6" marker-end="url(#w)"/>
  <path d="M604 176 h12 v-78 h14" stroke="#9aa4ae" stroke-width="1.6" fill="none" marker-end="url(#w)"/>

  <rect x="632" y="52" width="118" height="50" rx="8" fill="#eef6ec" stroke="#7fb069"/>
  <text x="691" y="75" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Result</text>
  <text x="691" y="93" text-anchor="middle" font-size="13" fill="#5b6b7a">viewer</text>

  <rect x="632" y="118" width="118" height="50" rx="8" fill="#eef6ec" stroke="#7fb069"/>
  <text x="691" y="141" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Result</text>
  <text x="691" y="159" text-anchor="middle" font-size="13" fill="#5b6b7a">lattice</text>

  <text x="20" y="226" font-size="13" fill="#5b6b7a">Step 3 appears only in sweep mode. Single mode goes straight to Compute.</text>
</svg>
