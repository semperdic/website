<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="270" rx="10" fill="#ffffff" stroke="#d8dee4"/>
  <text x="24" y="36" font-size="16" font-weight="600" fill="#1f2328">The virtual strain gauge is the distance one strain value covers.</text>
  <text x="24" y="58" font-size="13" fill="#5b6b7a">Strain is fitted over neighbouring grid points, not read from a single point.</text>

  <!-- grid points row -->
  <g fill="#0288d1">
    <circle cx="90" cy="134" r="4.5"/><circle cx="150" cy="134" r="4.5"/><circle cx="210" cy="134" r="4.5"/>
    <circle cx="270" cy="134" r="4.5"/><circle cx="330" cy="134" r="4.5"/><circle cx="390" cy="134" r="4.5"/>
    <circle cx="450" cy="134" r="4.5"/>
  </g>
  <line x1="70" y1="134" x2="480" y2="134" stroke="#d8dee4" stroke-width="1"/>

  <!-- highlighted window: 5 points -->
  <rect x="138" y="112" width="252" height="44" rx="6" fill="#e8f4fb" stroke="#0288d1" stroke-dasharray="4 3"/>
  <text x="264" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#0277bd">strain window = 5 points</text>

  <!-- step bracket -->
  <path d="M90 168 h60" stroke="#5b6b7a" stroke-width="1.6"/>
  <path d="M90 163 v10 M150 163 v10" stroke="#5b6b7a" stroke-width="1.6"/>
  <text x="120" y="188" text-anchor="middle" font-size="14" fill="#5b6b7a">step</text>

  <!-- vsg span -->
  <path d="M150 214 h240" stroke="#d64545" stroke-width="2.2"/>
  <path d="M150 208 v12 M390 208 v12" stroke="#d64545" stroke-width="2.2"/>
  <text x="270" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#d64545">VSG footprint</text>

  <!-- formula -->
  <rect x="510" y="94" width="226" height="120" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="528" y="122" font-size="15" font-weight="600" fill="#1f2328">VSG =</text>
  <text x="528" y="146" font-size="15" font-weight="600" fill="#1f2328">(window − 1) × step + 1</text>
  <text x="528" y="174" font-size="13" fill="#5b6b7a">Quote the VSG in a paper —</text>
  <text x="528" y="194" font-size="13" fill="#5b6b7a">it is what a sweep varies.</text>

  <text x="24" y="256" font-size="13" fill="#5b6b7a">Wider window: smoother strain, less detail. Narrower: more detail, more noise.</text>
</svg>
