<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 520" width="280" height="520" role="img" aria-label="Schematic of ROI editor">
  <rect width="280" height="520" rx="28" fill="#152430"/>
  <rect x="10" y="10" width="260" height="500" rx="22" fill="#F4F9FC"/>
  <text x="28" y="42" font-family="system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#152430">Region of interest</text>

  <rect x="28" y="60" width="224" height="220" rx="12" fill="#FFFFFF" stroke="#D6E4EC"/>
  <rect x="52" y="88" width="160" height="140" fill="#E1F5FE" stroke="#0288D1" stroke-width="2"/>
  <text x="132" y="155" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#014A72">Crop area</text>
  <rect x="96" y="120" width="48" height="36" fill="#FFCDD2" stroke="#E53935" stroke-width="1.5"/>
  <text x="120" y="142" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10" fill="#E53935">Erase</text>
  <circle cx="52" cy="88" r="5" fill="#0288D1"/>
  <circle cx="212" cy="88" r="5" fill="#0288D1"/>
  <circle cx="52" cy="228" r="5" fill="#0288D1"/>
  <circle cx="212" cy="228" r="5" fill="#0288D1"/>

  <rect x="28" y="300" width="104" height="40" rx="8" fill="#0288D1"/>
  <text x="80" y="325" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FFF">Crop</text>
  <rect x="148" y="300" width="104" height="40" rx="8" fill="#FFFFFF" stroke="#E53935"/>
  <text x="200" y="325" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E53935">Erase</text>

  <text x="140" y="370" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#5B6B7A">ROI must be larger than the subset</text>
  <rect x="28" y="392" width="224" height="40" rx="8" fill="#0288D1"/>
  <text x="140" y="417" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FFF">Save ROI</text>
</svg>