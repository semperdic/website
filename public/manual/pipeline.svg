<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="250" rx="10" fill="#ffffff" stroke="#d8dee4"/>

  <!-- inputs -->
  <rect x="20" y="44" width="168" height="62" rx="8" fill="#e8f4fb" stroke="#0288d1"/>
  <text x="104" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Reference frame</text>
  <text x="104" y="93" text-anchor="middle" font-size="14" fill="#5b6b7a">undeformed, ×1</text>

  <rect x="20" y="132" width="168" height="62" rx="8" fill="#e8f4fb" stroke="#0288d1"/>
  <text x="104" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Deformed frames</text>
  <text x="104" y="181" text-anchor="middle" font-size="14" fill="#5b6b7a">one per load step, ×N</text>

  <path d="M194 75 h34 l0 44" stroke="#9aa4ae" stroke-width="1.6" fill="none"/>
  <path d="M194 163 h34 l0 -44" stroke="#9aa4ae" stroke-width="1.6" fill="none"/>
  <path d="M228 119 h36" stroke="#9aa4ae" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa4ae"/>
    </marker>
  </defs>

  <!-- solver -->
  <rect x="268" y="76" width="196" height="96" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="366" y="108" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Match subsets</text>
  <text x="366" y="130" text-anchor="middle" font-size="14" fill="#5b6b7a">on a grid inside your ROI</text>
  <text x="366" y="150" text-anchor="middle" font-size="14" fill="#5b6b7a">runs on the phone</text>

  <path d="M470 120 h36" stroke="#9aa4ae" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- outputs -->
  <rect x="512" y="34" width="228" height="182" rx="8" fill="#ffffff" stroke="#d8dee4"/>
  <text x="530" y="62" font-size="15" font-weight="600" fill="#1f2328">Five fields, per frame</text>

  <rect x="530" y="78" width="104" height="30" rx="5" fill="#eef6ec" stroke="#7fb069"/>
  <text x="582" y="98" text-anchor="middle" font-size="15" fill="#1f2328">U · V</text>
  <text x="646" y="98" font-size="13" fill="#5b6b7a">displacement, px</text>

  <rect x="530" y="120" width="104" height="30" rx="5" fill="#fdf0e6" stroke="#e8a05c"/>
  <text x="582" y="140" text-anchor="middle" font-size="14" fill="#1f2328">Exx · Eyy · Exy</text>
  <text x="646" y="140" font-size="13" fill="#5b6b7a">strain, mε</text>

  <text x="530" y="180" font-size="13" fill="#5b6b7a">Plus ZNSSD per point —</text>
  <text x="530" y="198" font-size="13" fill="#5b6b7a">match quality, in the CSV.</text>
</svg>
